<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Registro Verde</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <link rel="stylesheet" href="../css/login.css">
</head>

<body>
  <div id="g_id_onload"
        data-client_id="287615705424-1j8aoo12lnogicqttm9q3u6k6vad3iqv.apps.googleusercontent.com"
        data-context="signin"
        data-ux_mode="popup"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false">
  </div>

  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-card">
        <div class="auth-card-header">
          <a href="../index.html" class="auth-logo">
            <div class="auth-logo-icon"><i data-lucide="leaf" width="18" height="18"></i></div>
            <span style="font-weight:700;color:var(--bg-dark);">Registro Verde</span>
          </a>
          <h1 id="auth-title">Bem-vindo de volta</h1>
          <p id="auth-subtitle">Acesse sua conta no Registro Verde</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Entrar</button>
          <button class="auth-tab" data-tab="register">Cadastrar</button>
        </div>

        <div class="auth-alert" id="auth-alert"></div>

        <form id="auth-form" autocomplete="off">
          <div id="register-fields" style="display:none;">
            <div class="form-group">
              <label>Nome completo</label>
              <input type="text" id="name-input" placeholder="Seu nome">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Telefone</label>
                <input type="tel" id="phone-input" placeholder="(92) 99999-9999" inputmode="numeric" pattern="[0-9]*">
              </div>
              <div class="form-group">
                <label>Cidade</label>
                <input type="text" id="city-input" placeholder="Manaus">
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="email-input" placeholder="seu@email.com" required>
          </div>

          <div class="form-group">
            <label>Senha</label>
            <div class="password-input-wrap">
              <input type="password" id="password-input" placeholder="••••••••" required>
              <button type="button" class="password-toggle" id="password-toggle" tabindex="-1">
                <i data-lucide="eye" width="18" height="18"></i>
              </button>
            </div>
            <div class="password-strength-meter">
              <div class="strength-bar" id="strength-bar"></div>
            </div>
          </div>

          <div class="form-group" id="confirm-password-group" style="display:none;">
            <label>Confirmar senha</label>
            <div class="password-input-wrap">
              <input type="password" id="confirm-password-input" placeholder="••••••••">
            </div>
            <div class="password-match-meter">
              <div class="strength-bar" id="match-bar"></div>
            </div>
          </div>

          <div id="forgot-link" style="text-align:right;margin-bottom:0.5rem;">
            <a href="forgot-password.html" style="font-size:0.8rem;color:#64748b;text-decoration:none;">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="btn-auth" id="submit-btn">
            <i data-lucide="log-in" width="18" height="18" id="btn-icon"></i>
            <span id="btn-text">Entrar</span>
          </button>
        </form>

        <div class="auth-divider">ou</div>

        <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
          <div class="g_id_signin" data-type="standard" data-width="100%"></div>
        </div>

        <button class="btn-auth-secondary" id="toggle-mode-btn">
          <i data-lucide="user-plus" width="18" height="18"></i>
          <span id="toggle-text">Criar uma conta</span>
        </button>

        <div class="auth-footer-links" style="margin-top: 1rem;">
          <a href="../index.html" style="text-decoration: none; color: #64748b; font-size: 0.9rem;">&larr; Voltar para o início</a>
        </div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-banner">
        <span class="auth-banner-icon">🌿</span>
        <h2>Juntos por um Amazonas mais limpo</h2>
        <p>No Registro Verde, você recicla, ganha pontos e ajuda a preservar nossa floresta e rios.</p>
        <div class="auth-stats">
          <div class="auth-stat-item">
            <div class="auth-stat-value" id="auth-guardioes">12.4k+</div>
            <div class="auth-stat-label">Guardiões</div>
          </div>
          <div class="auth-stat-item">
            <div class="auth-stat-value" id="auth-scans">85k</div>
            <div class="auth-stat-label">Scans</div>
          </div>
          <div class="auth-stat-item">
            <div class="auth-stat-value" id="auth-residuos">48t</div>
            <div class="auth-stat-label">Reciclados</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/login.js"></script>
  <script>
    lucide.createIcons();

    // BLOQUEIO DE LETRAS E MÁSCARA (Adicionado para segurança)
    const phoneInput = document.getElementById('phone-input');
    if (phoneInput) {
      phoneInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, ""); // Remove letras
        if (value.length > 0) {
          value = value.replace(/^(\d{2})(\d)/g, "($1) $2");
          value = value.replace(/(\d{5})(\d)/, "$1-$2");
        }
        e.target.value = value.substring(0, 15);
      });
    }

    function handleCredentialResponse(response) {
      console.log("Google Token:", response.credential);
    }
  </script>
</body>
</html>
