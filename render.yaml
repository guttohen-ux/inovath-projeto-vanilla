services:
  - type: web
    name: registro-verde-backend
    runtime: python
    rootDir: Registro-verde-backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/dashboard
    envVars:
      - key: FLASK_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: registro-verde-frontend
    runtime: static
    rootDir: frontend-vanilla
    buildCommand: node ../build-config.js
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: API_URL
        sync: false
